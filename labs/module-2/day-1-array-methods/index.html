<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 1.1 — Array methods</title>
  <style>
    :root { color-scheme: light; }

    body {
      max-width: 60rem;
      margin-inline: auto;
      padding: 2.5rem 1rem 4rem;
      background-color: #fbfbfc;
      color: #1a1f27;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }

    h1 { font-size: 1.6rem; margin: 0 0 0.25rem; }
    h2 { font-size: 1.05rem; margin: 2rem 0 0.75rem; color: #5d6672; }
    h3 { font-size: 0.95rem; margin: 1.25rem 0 0.5rem; }
    p.lead { margin: 0 0 1rem; color: #5d6672; }
    a { color: #2f5bea; }

    code, pre { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 0.85rem; }

    pre {
      margin: 0;
      padding: 0.9rem 1rem;
      background: #0e1218;
      border-radius: 10px;
      color: #e8ecf3;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .panel {
      padding: 1rem;
      background: #fff;
      border: 1px solid #e2e7ee;
      border-radius: 12px;
    }

    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem; }

    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 0.4rem 0.6rem; border-bottom: 1px solid #e2e7ee; text-align: left; vertical-align: top; }
    th { color: #5d6672; font-weight: 600; }

    button {
      padding: 0.45rem 0.9rem;
      background: #fff;
      border: 1px solid #d7dde6;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }

    button:hover { border-color: #2f5bea; color: #2f5bea; }

    input, select {
      padding: 0.45rem 0.7rem;
      border: 1px solid #d7dde6;
      border-radius: 8px;
      font: inherit;
    }

    .note { color: #5d6672; font-size: 0.9rem; }
    .back { display: inline-block; margin-top: 2.5rem; }
  </style>
</head>
<body>
  <h1>Array methods over a product list</h1>
  <p class="lead">
    map / filter / reduce / sort / find, then the same job written twice: once
    as an old-school <code>for</code> loop, once as a chain. Open the console
    too — every result is logged there as well.
  </p>

  <section class="panel">
    <h2>Results</h2>
    <pre id="out"></pre>
  </section>

  <a class="back" href="../index.html">&larr; Back to the module 2 labs</a>

  <script>
    const products = [
      { id: 1, title: 'Aura X2 Headphones', price: 99.99, category: 'audio', rating: 4.8 },
      { id: 2, title: 'Nova 12 Pro Smartphone', price: 519, category: 'smartphones', rating: 4.7 },
      { id: 3, title: 'Zenbook Air 14', price: 860, category: 'laptops', rating: 4.9 },
      { id: 4, title: 'Pulse 3 Smartwatch', price: 75.5, category: 'watches', rating: 4.5 },
      { id: 5, title: 'Kite 68 Keyboard', price: 46, category: 'accessories', rating: 4.6 },
      { id: 6, title: 'Glide M2 Mouse', price: 23.6, category: 'accessories', rating: 4.4 },
      { id: 7, title: 'Boom Mini Speaker', price: 31.2, category: 'audio', rating: 4.3 },
      { id: 8, title: 'Paper 7 E-Reader', price: 138, category: 'e-readers', rating: 4.8 },
    ];

    const out = document.querySelector('#out');
    const show = (label, value) => {
      out.textContent += `${label}\n  ${JSON.stringify(value)}\n\n`;
      console.log(label, value);
    };

    /* map — same length, every item transformed */
    show('map: titles only', products.map((p) => p.title));

    /* filter — keeps what passes the test */
    show('filter: under $100', products.filter((p) => p.price < 100).map((p) => p.title));
    show('filter: category = accessories', products.filter((p) => p.category === 'accessories').map((p) => p.title));

    /* reduce — many values folded into one */
    show('reduce: total price of everything', products.reduce((sum, p) => sum + p.price, 0));

    /* reduce can also build an object: count per category */
    show('reduce: how many per category', products.reduce((acc, p) => {
      acc[p.category] = (acc[p.category] ?? 0) + 1;
      return acc;
    }, {}));

    /* sort — MUTATES, so always sort a copy */
    show('sort: cheapest first', [...products].sort((a, b) => a.price - b.price).map((p) => p.price));
    show('sort: priciest first', [...products].sort((a, b) => b.price - a.price).map((p) => p.price));
    show('the original array is still in its own order', products.map((p) => p.price));

    /* find / some / every */
    show('find: id 5', products.find((p) => p.id === 5));
    show('find: id 99 (no match)', products.find((p) => p.id === 99)); // undefined
    show('some: anything over $800?', products.some((p) => p.price > 800));
    show('every: everything rated above 4?', products.every((p) => p.rating > 4));

    /* ---- the same job, two ways ------------------------------------- */

    // The old loop: declare, push, mutate.
    function cheapAudioLoop(list) {
      const result = [];
      for (let i = 0; i < list.length; i++) {
        if (list[i].category === 'audio' && list[i].price < 100) {
          result.push(list[i].title.toUpperCase());
        }
      }
      return result;
    }

    // The chain: one expression, nothing mutated, reads like the sentence
    // "audio products under 100, shouted".
    const cheapAudioChain = (list) =>
      list
        .filter((p) => p.category === 'audio')
        .filter((p) => p.price < 100)
        .map((p) => p.title.toUpperCase());

    show('for loop', cheapAudioLoop(products));
    show('filter().filter().map()', cheapAudioChain(products));
    show('same result?', JSON.stringify(cheapAudioLoop(products)) === JSON.stringify(cheapAudioChain(products)));
  </script>
</body>
</html>
