<body>
  <h1>Destructuring, spread and rest</h1>
  <p class="lead">
    Pulling values out of objects and arrays, copying without sharing, and
    functions that take however many arguments you throw at them.
  </p>

  <section class="panel">
    <h2>Results</h2>
    <pre id="out"></pre>
  </section>

  <a class="back" href="../index.html">&larr; Back to the module 2 labs</a>

  <script>
    const product = {
      id: 1,
      title: 'Aura X2 Headphones',
      price: 99.99,
      category: 'audio',
      meta: { rating: 4.8, reviews: 126 },
    };

    const out = document.querySelector('#out');
    const show = (label, value) => {
      out.textContent += `${label}\n  ${JSON.stringify(value)}\n\n`;
      console.log(label, value);
    };

    /* --- Object destructuring ---------------------------------------- */
    const { title, price } = product;
    show('const { title, price }', { title, price });

    // rename + default for a key that does not exist
    const { title: name, discount = 0 } = product;
    show('rename and default', { name, discount });

    // nested
    const { meta: { rating, reviews } } = product;
    show('nested destructuring', { rating, reviews });

    // rest: "everything I did not name"
    const { id, ...withoutId } = product;
    show('rest of the object', withoutId);

    /* --- Array destructuring ----------------------------------------- */
    const prices = [99.99, 519, 860, 75.5, 46];
    const [first, second, ...rest] = prices;
    show('[first, second, ...rest]', { first, second, rest });

    // skipping, and swapping without a temp variable
    const [, , third] = prices;
    let a = 'left';
    let b = 'right';
    [a, b] = [b, a];
    show('skip a slot / swap without a temp', { third, a, b });

    /* --- Spread: copies, never references ---------------------------- */
    const discounted = { ...product, discounted: true, price: 79.99 };
    show('spread + override', { price: discounted.price, discounted: discounted.discounted });
    show('the original is untouched', product.price);

    const merged = { ...{ shipping: 'free', gift: false }, ...{ gift: true } };
    show('merge: the LAST spread wins', merged);

    const copy = [...prices];
    copy.push(1);
    show('array copy is independent', { copy: copy.length, prices: prices.length });

    // The catch worth knowing: spread copies one level deep only.
    const shallow = { ...product };
    shallow.meta.rating = 1;
    show('shallow copy shares nested objects', product.meta.rating);
    product.meta.rating = 4.8; // put it back

    /* --- Default + rest parameters ----------------------------------- */
    function priceTag(value, currency = '$', decimals = 2) {
      return `${currency}${value.toFixed(decimals)}`;
    }
    show('default parameters', [priceTag(99.9), priceTag(99.9, 'EUR '), priceTag(99.9, '$', 0)]);

    // Rest parameters: gather every extra argument into one real array.
    function cartTotal(...amounts) {
      return amounts.reduce((sum, n) => sum + n, 0);
    }
    show('rest parameters', [cartTotal(), cartTotal(10), cartTotal(10, 20, 5.5)]);
    show('spread an array INTO a call', cartTotal(...prices));

    // Destructuring in the parameter list — the pattern used all over ShopLite.
    const summarise = ({ title, price, category = 'misc' }) => `${title} (${category}) — $${price}`;
    show('destructured parameter', summarise(product));
  </script>
</body>
